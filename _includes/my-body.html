<!--
Code for integrating CloudFlare's email protection with Hydejack's single page app loading.
-->
<script>
  document.getElementById('_pushState').addEventListener('hy-push-state-after', function (e) {
    function e(e){
      (console.error?console.error:console.log).call(console,e)
    }

    function t(e){
      return l.innerHTML='<a href="'+e.replace(/"/g,"&quot;")+'"></a>',l.childNodes[0].getAttribute("href")
    }

    function r(e,t){
      var r=e.substr(t,2);return parseInt(r,16)
    }

    function n(e,n){
      for(var o="",c=r(e,n),a=n+2;a<e.length;a+=2){
        var l=r(e,a)^c;
        o+=String.fromCharCode(l)
      }
      return t(o)
    }

    var o="/cdn-cgi/l/email-protection#",
        c=".__cf_email__",
        a="data-cfemail",
        l=document.createElement("div");

    !function(){
      for(var t=document.getElementsByTagName("a"),r=0;r<t.length;r++)
        try{
          var c=t[r],a=c.href.indexOf(o);
          a>-1&&(c.href="mailto:"+n(c.href,a+o.length))
        }catch(t){
          e(t)
        }
    }(),
    function(){
      for(var t=document.querySelectorAll(c),r=0;r<t.length;r++)
        try{
          var o=t[r],l=n(o.getAttribute(a),0),i=document.createTextNode(l);
          o.parentNode.replaceChild(i,o)
        }catch(t){
          e(t)
        }
    }()
  });
</script>

<!--
Example code for using Matamo as alternative analytics solution.
-->
{% if site.matomo_analytics %}
<script>
  var _paq = _paq || [];

  /*{% if site.matomo_analytics.no_cookies %}*/
  _paq.push(['disableCookies']);
  /*{% endif %}*/

  _paq.push(['trackPageView']);
  _paq.push(['enableLinkTracking']);
  _paq.push(['setTrackerUrl', u+'piwik.php']);
  _paq.push(['setSiteId', '{{site.matomo_analytics.site_id}}']);

  var pushStateEl = document.getElementById('_pushState');
  var timeStartLoadPage, referer, timeItTookToLoadPage;

  pushStateEl.addEventListener('hy-push-state-start', function() {
    timeStartLoadPage = new Date().getTime();
    referer = window.location.toString();
  });

  pushStateEl.addEventListener('hy-push-state-ready', function() {
    timeItTookToLoadPage = new Date().getTime() - timeStartLoadPage;
  });

  pushStateEl.addEventListener('hy-push-state-after', function() {
    _paq.push(['setReferrerUrl', referer]);
    _paq.push(['setCustomUrl', window.location.toString()]);
    _paq.push(['setDocumentTitle', document.title]);
    _paq.push(['deleteCustomVariables', 'page']);
    _paq.push(['setGenerationTimeMs', timeItTookToLoadPage]);
    _paq.push(['trackPageView']);
  });

  window.loadJSDeferred('{{site.matomo_analytics.root}}piwik.js');
</script>
{% endif %}
{% endcomment %}

<!-- 상단바: 라이트/다크 모드 버튼 오른쪽 검색 아이콘 -->
<script>
(function() {
  var SEARCH_PAGE = '{{ "/search/" | relative_url }}';
  var injectTries = 0;

  function findThemeToggle() {
    return document.querySelector('#_dark-mode')
      || document.querySelector('hy-dark-mode')
      || document.querySelector('hy-theme-toggle')
      || document.querySelector('[data-theme-toggle]')
      || document.querySelector('#_navbar [aria-label*="Dark" i]')
      || document.querySelector('#_navbar [aria-label*="Light" i]')
      || document.querySelector('#_navbar [aria-label*="theme" i]')
      || document.querySelector('#_navbar button:last-of-type')
      || document.querySelector('#_navbar .navbar-btn:last-of-type');
  }

  function positionPanel(btn, panel) {
    var rect = btn.getBoundingClientRect();
    var gap = 8;
    var margin = 12;
    var onRightHalf = rect.left > window.innerWidth / 2;
    var maxWidth = Math.min(640, window.innerWidth - margin * 2);
    var width = Math.max(280, maxWidth);
    var left;

    if (onRightHalf) {
      left = rect.right - width;
      if (left < margin) left = margin;
    } else {
      left = rect.left;
      width = Math.min(640, window.innerWidth - left - margin);
      if (width < 280) {
        left = margin;
        width = Math.min(640, window.innerWidth - margin * 2);
      }
    }

    panel.style.top = (rect.bottom + gap) + 'px';
    panel.style.left = left + 'px';
    panel.style.width = width + 'px';
  }

  function injectSearchButton() {
    if (document.getElementById('custom-search')) return;

    var themeToggle = findThemeToggle();
    if (!themeToggle) {
      if (injectTries++ < 40) setTimeout(injectSearchButton, 100);
      return;
    }

    var wrap = document.createElement('div');
    wrap.id = 'custom-search';
    wrap.className = 'custom-search';

    var searchBtn = document.createElement('button');
    searchBtn.id = 'custom-search-btn';
    searchBtn.className = 'custom-search-toggle navbar-btn';

    searchBtn.setAttribute('type', 'button');
    searchBtn.setAttribute('aria-label', 'Search');
    searchBtn.setAttribute('aria-expanded', 'false');
    searchBtn.innerHTML =
      '<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<circle cx="11" cy="11" r="8"></circle>' +
      '<line x1="21" y1="21" x2="16.65" y2="16.65"></line>' +
      '</svg>';

    var panel = document.createElement('div');
    panel.id = 'custom-search-dropdown';
    panel.className = 'custom-search-dropdown';
    panel.innerHTML =
      '<form id="custom-search-form" action="' + SEARCH_PAGE + '" method="get" role="search">' +
      '<input type="search" id="custom-search-input" name="q" placeholder="검색어를 입력하고 Enter" autocomplete="off" />' +
      '</form>';

    wrap.appendChild(searchBtn);
    document.body.appendChild(panel);

    var parent = themeToggle.parentNode;
    if (parent) {
      parent.insertBefore(wrap, themeToggle.nextSibling);
    } else {
      themeToggle.appendChild(wrap);
    }

    function openPanel() {
      wrap.classList.add('is-open');
      panel.classList.add('active');
      searchBtn.setAttribute('aria-expanded', 'true');
      positionPanel(searchBtn, panel);
      var input = document.getElementById('custom-search-input');
      setTimeout(function() { input.focus(); }, 0);
    }

    function closePanel() {
      wrap.classList.remove('is-open');
      panel.classList.remove('active');
      searchBtn.setAttribute('aria-expanded', 'false');
    }

    searchBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      e.preventDefault();
      if (panel.classList.contains('active')) closePanel();
      else openPanel();
    });

    document.getElementById('custom-search-form').addEventListener('submit', function(e) {
      var query = document.getElementById('custom-search-input').value.trim();
      if (!query) e.preventDefault();
    });

    document.addEventListener('click', function(e) {
      if (!panel.contains(e.target) && !searchBtn.contains(e.target)) closePanel();
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closePanel();
    });

    window.addEventListener('resize', function() {
      if (panel.classList.contains('active')) positionPanel(searchBtn, panel);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', injectSearchButton);
  } else {
    injectSearchButton();
  }

  var pushStateEl = document.getElementById('_pushState') || document.querySelector('hy-push-state');
  if (pushStateEl) {
    pushStateEl.addEventListener('hy-push-state-after', injectSearchButton);
  }
})();
</script>

<style>

}

}

  cursor: pointer !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  opacity: 0.85;
  transition: background-color 0.15s ease-in-out, opacity 0.15s ease-in-out !important;
  line-height: 0;
  height: 100% !important; /* 직사각형 전체 영역 높이 확보 */
  border-radius: 0 !important; /* 둥근 모서리 제거 */
  box-sizing: border-box;
}

/* 아이콘 색상 및 굵기 직접 지정 */

  stroke-width: 3 !important;
}

.custom-search-toggle:hover,
.custom-search.is-open .custom-search-toggle {
  opacity: 1;
  /* 기존 테마의 hover 명암과 동일하게 은은한 어두움/밝음 레이어 적용 */
  background-color: rgba(0, 0, 0, 0.05) !important;
